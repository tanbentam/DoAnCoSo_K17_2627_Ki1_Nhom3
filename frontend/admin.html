<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartRecruit AI — HR Dashboard</title>

  <!-- Font Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tabler 1.6.1 (dựng trên Bootstrap 5, dùng thay bootstrap.min.css) -->
  <link
    href="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.1/dist/css/tabler.min.css"
    rel="stylesheet"
    integrity="sha384-tT2UAGE9hxG/p5d0iGIvZ/s8El3nWWG3tfG02i8iOY5Pbf8cZZRVmcrrVs+JG5Vw"
    crossorigin="anonymous"
  />

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    rel="stylesheet"
    integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk"
    crossorigin="anonymous"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="admin-body">
  <!-- A1: Đăng nhập (hiện khi chưa có token) -->
  <section id="view-login" class="login-page d-none" aria-labelledby="login-title">
    <div class="card login-card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <span class="brand-logo mb-2"><i class="bi bi-stars"></i></span>
          <h1 class="h3 mb-1" id="login-title">SmartRecruit AI</h1>
          <p class="text-secondary mb-0">Đăng nhập dành cho nhân sự (HR)</p>
        </div>
        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="login-email">Email</label>
            <input type="email" class="form-control" id="login-email" placeholder="hr@congty.com" autocomplete="username" required />
            <div class="invalid-feedback">Vui lòng nhập email hợp lệ</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="login-password">Mật khẩu</label>
            <div class="input-group has-validation">
              <input type="password" class="form-control" id="login-password" autocomplete="current-password" required />
              <button type="button" class="btn btn-outline-secondary" id="login-toggle-password" aria-label="Hiện mật khẩu" aria-pressed="false">
                <i class="bi bi-eye"></i>
              </button>
              <div class="invalid-feedback">Vui lòng nhập mật khẩu</div>
            </div>
          </div>
          <div id="login-error" class="alert alert-danger py-2 small d-flex align-items-center gap-2 d-none" role="alert">
            <i class="bi bi-x-circle-fill"></i><span></span>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="login-submit">
            <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
          </button>
        </form>
      </div>
    </div>
  </section>

  <!-- Bảng điều khiển (hiện khi đã đăng nhập) -->
  <div id="view-dashboard" class="page d-none">
    <!-- A2: Thanh điều hướng -->
    <header class="navbar navbar-expand-md d-print-none border-bottom bg-white">
      <div class="container-xl">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#admin-nav" aria-controls="admin-nav" aria-expanded="false" aria-label="Mở menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <a href="admin.html" class="navbar-brand d-flex align-items-center gap-2 fw-bold me-md-4">
          <span class="brand-logo"><i class="bi bi-stars"></i></span>
          <span>SmartRecruit AI</span>
          <span class="badge bg-blue-lt">HR</span>
        </a>

        <!-- Tài khoản: luôn hiện, kể cả trên điện thoại -->
        <div class="navbar-nav flex-row order-md-last">
          <div class="nav-item dropdown">
            <a href="#" class="nav-link d-flex align-items-center gap-2 px-0" data-bs-toggle="dropdown" aria-label="Tài khoản" aria-expanded="false">
              <span class="avatar avatar-sm rounded-circle bg-primary-lt" id="user-avatar"></span>
              <span class="d-none d-lg-inline small user-email"></span>
            </a>
            <div class="dropdown-menu dropdown-menu-end">
              <span class="dropdown-header">Đang đăng nhập</span>
              <span class="dropdown-item-text small text-truncate user-email user-email-menu"></span>
              <div class="dropdown-divider"></div>
              <button type="button" class="dropdown-item text-danger" id="logout-btn">
                <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
              </button>
            </div>
          </div>
        </div>

        <div class="collapse navbar-collapse" id="admin-nav">
          <ul class="navbar-nav">
            <li class="nav-item active">
              <a class="nav-link" href="#" aria-current="page"><i class="bi bi-kanban me-2"></i>Bảng Kanban</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" id="nav-jobs"><i class="bi bi-briefcase me-2"></i>Tin tuyển dụng</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right me-2"></i>Cổng ứng viên</a>
            </li>
          </ul>
        </div>
      </div>
    </header>

    <div class="page-wrapper">
      <!-- A3: Chọn tin tuyển dụng + nút tạo / sửa tin -->
      <div class="page-header d-print-none">
        <div class="container-xl">
          <div class="row g-3 align-items-end">
            <div class="col-12 col-md">
              <div class="page-pretitle">Bảng Kanban tuyển dụng</div>
              <label class="visually-hidden" for="job-select">Chọn tin tuyển dụng</label>
              <select id="job-select" class="form-select job-switch mt-1 fw-semibold" disabled>
                <option>Đang tải tin tuyển dụng…</option>
              </select>
              <div class="d-flex flex-wrap gap-2 mt-2" id="job-meta"></div>
            </div>
            <div class="col-12 col-md-auto d-flex gap-2">
              <button type="button" class="btn btn-outline-secondary" id="reload-btn" aria-label="Tải lại" title="Tải lại">
                <i class="bi bi-arrow-clockwise"></i>
              </button>
              <button type="button" class="btn btn-outline-primary" id="edit-job-btn" disabled>
                <i class="bi bi-pencil me-1"></i>Sửa tin
              </button>
              <button type="button" class="btn btn-primary" id="create-job-btn">
                <i class="bi bi-plus-lg me-1"></i>Tạo tin mới
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Bảng Kanban 5 cột -->
      <div class="page-body">
        <div class="container-xl">
          <div id="kanban-board">
            <!-- admin.js vẽ trạng thái đang tải / rỗng / lỗi hoặc các cột -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tabler JS (đã gói sẵn Bootstrap 5 JS: modal, dropdown, tab, toast) -->
  <script
    src="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.1/dist/js/tabler.min.js"
    integrity="sha384-1yCHfhyU8+V33urXkAlLLpNYd9jdzXkxdafCg0+auIIEtYFnOuM/DwJQgk5sXY98"
    crossorigin="anonymous"
  ></script>
  <!-- Tabler đặt Bootstrap ở window.tabler; gán lại để code gọi được bootstrap.Modal, bootstrap.Toast… -->
  <script>window.bootstrap = window.bootstrap || window.tabler;</script>

  <!-- SortableJS CDN (Kanban drag-and-drop) -->
  <script
    src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"
    integrity="sha384-BSxuMLxX+FCbTdYec3TbXlnMGEEM2QXTFdtDaveen71o+jswm2J36+xFqp8k4VHM"
    crossorigin="anonymous"
  ></script>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
