<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartRecruit AI — HR Dashboard</title>

  <!-- Font Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tabler 1.6.1 (dựng trên Bootstrap 5, dùng thay bootstrap.min.css) -->
  <link
    href="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.1/dist/css/tabler.min.css"
    rel="stylesheet"
    integrity="sha384-tT2UAGE9hxG/p5d0iGIvZ/s8El3nWWG3tfG02i8iOY5Pbf8cZZRVmcrrVs+JG5Vw"
    crossorigin="anonymous"
  />

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    rel="stylesheet"
    integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk"
    crossorigin="anonymous"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <!-- Navbar -->
    <header class="navbar navbar-expand-md d-print-none border-bottom">
      <div class="container-xl">
        <a href="#" class="navbar-brand d-flex align-items-center gap-2 fw-bold">
          <span class="brand-logo"><i class="bi bi-stars"></i></span>
          SmartRecruit AI
          <span class="badge bg-blue-lt ms-1">HR</span>
        </a>
      </div>
    </header>

    <div class="page-wrapper">
      <!-- Page header -->
      <div class="page-header d-print-none">
        <div class="container-xl">
          <div class="page-pretitle">HR Dashboard</div>
          <h2 class="page-title">Bảng Kanban Tuyển dụng</h2>
        </div>
      </div>

      <!-- Kanban -->
      <div class="page-body">
        <div class="container-xl">
          <div class="row g-3" id="kanban-board">
            <!-- Columns rendered by JS -->
            <div class="col-12 text-center text-secondary py-5">
              <div class="spinner-border text-primary" role="status"></div>
              <p class="mt-2">Đang tải dữ liệu Kanban…</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tabler JS (đã gói sẵn Bootstrap 5 JS: modal, dropdown, tab, toast) -->
  <script
    src="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.1/dist/js/tabler.min.js"
    integrity="sha384-1yCHfhyU8+V33urXkAlLLpNYd9jdzXkxdafCg0+auIIEtYFnOuM/DwJQgk5sXY98"
    crossorigin="anonymous"
  ></script>
  <!-- Tabler đặt Bootstrap ở window.tabler; gán lại để code gọi được bootstrap.Modal, bootstrap.Toast… -->
  <script>window.bootstrap = window.bootstrap || window.tabler;</script>

  <!-- SortableJS CDN (Kanban drag-and-drop) -->
  <script
    src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"
    integrity="sha384-BSxuMLxX+FCbTdYec3TbXlnMGEEM2QXTFdtDaveen71o+jswm2J36+xFqp8k4VHM"
    crossorigin="anonymous"
  ></script>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
