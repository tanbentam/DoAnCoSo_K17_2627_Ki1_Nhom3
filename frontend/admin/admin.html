<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartRecruit AI — HR Dashboard</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid gap-3">
      <a class="navbar-brand fw-bold" href="./admin.html">
        🤖 SmartRecruit AI
      </a>

      <div id="hr-session" class="ms-auto" hidden>
        <div class="d-flex align-items-center flex-wrap gap-3">
          <span id="hr-email" class="text-white"></span>
          <button
            type="button"
            id="logout-button"
            class="btn btn-outline-light btn-sm"
          >
            Đăng xuất
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-4">
    <!-- A1: Đăng nhập -->
    <section id="login-section" aria-labelledby="login-heading">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5 col-xl-4">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h3 mb-2" id="login-heading">Đăng nhập HR</h1>
              <p class="text-muted">
                Quản lý tin tuyển dụng và hồ sơ ứng viên.
              </p>

              <div
                id="login-message"
                class="alert"
                role="alert"
                hidden
              ></div>

              <form id="login-form" novalidate>
                <div class="mb-3">
                  <label for="login-email" class="form-label">Email</label>
                  <input
                    type="email"
                    id="login-email"
                    class="form-control"
                    autocomplete="username"
                    maxlength="255"
                    required
                  />
                </div>

                <div class="mb-4">
                  <label for="login-password" class="form-label">
                    Mật khẩu
                  </label>
                  <input
                    type="password"
                    id="login-password"
                    class="form-control"
                    autocomplete="current-password"
                    required
                  />
                </div>

                <button
                  type="submit"
                  id="login-button"
                  class="btn btn-primary w-100"
                >
                  Đăng nhập
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- A2–A4: Quản lý tuyển dụng -->
    <section id="dashboard-section" hidden>
      <h1 class="h2 mb-4" id="dashboard-heading" tabindex="-1">
        Bảng điều khiển tuyển dụng
      </h1>

      <div
        id="dashboard-message"
        class="alert"
        role="status"
        aria-live="polite"
        hidden
      ></div>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="d-flex justify-content-between flex-wrap gap-3 mb-3">
            <h2 class="h5 mb-0">Tin tuyển dụng</h2>

            <div class="d-flex flex-wrap gap-2">
              <button
                type="button"
                id="hr-jobs-refresh"
                class="btn btn-outline-primary btn-sm"
              >
                Tải lại danh sách
              </button>

              <button
                type="button"
                id="job-create-button"
                class="btn btn-primary btn-sm"
              >
                Tạo tin mới
              </button>
            </div>
          </div>

          <div id="hr-jobs-loading" role="status" hidden>
            <span
              class="spinner-border spinner-border-sm me-2"
              aria-hidden="true"
            ></span>
            Đang tải tin tuyển dụng…
          </div>

          <div
            id="hr-jobs-error"
            class="alert alert-danger mb-0"
            role="alert"
            hidden
          >
            <p id="hr-jobs-error-message"></p>
            <button
              type="button"
              id="hr-jobs-retry"
              class="btn btn-outline-danger"
            >
              Thử lại
            </button>
          </div>

          <div
            id="hr-jobs-empty"
            class="alert alert-info mb-0"
            hidden
          >
            Chưa có tin tuyển dụng. Bấm “Tạo tin mới” để bắt đầu.
          </div>

          <div id="hr-jobs-content" hidden>
            <label for="hr-job-select" class="form-label">
              Chọn tin tuyển dụng
            </label>

            <select
              id="hr-job-select"
              class="form-select"
              aria-describedby="hr-job-summary"
            ></select>

            <p
              id="hr-job-summary"
              class="text-muted small mt-2"
              aria-live="polite"
            ></p>

            <div class="d-flex flex-wrap gap-2">
              <button
                type="button"
                id="job-edit-button"
                class="btn btn-outline-primary"
              >
                Sửa tin
              </button>

              <button
                type="button"
                id="job-close-button"
                class="btn btn-outline-danger"
              >
                Đóng tin
              </button>
            </div>
          </div>
        </div>
      </section>

      <section aria-labelledby="kanban-heading">
        <h2 class="h4 mb-3" id="kanban-heading">Hồ sơ ứng viên</h2>
        <div id="kanban-board" class="row g-3"></div>
      </section>
    </section>

    <noscript>
      <div class="alert alert-warning">
        Vui lòng bật JavaScript để sử dụng bảng quản trị.
      </div>
    </noscript>
  </main>

  <!-- A4: Tạo / sửa tin -->
  <div
    class="modal fade"
    id="job-editor-modal"
    tabindex="-1"
    aria-labelledby="job-editor-title"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="job-editor-title">
            Tạo tin tuyển dụng
          </h2>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Đóng"
          ></button>
        </div>

        <div class="modal-body">
          <div
            id="job-editor-message"
            class="alert"
            role="alert"
            hidden
          ></div>

          <form id="job-form" novalidate>
            <fieldset id="job-fields">
              <div class="mb-3">
                <label for="job-title" class="form-label">
                  Tiêu đề *
                </label>
                <input
                  type="text"
                  id="job-title"
                  class="form-control"
                  maxlength="255"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="job-description" class="form-label">
                  Mô tả công việc *
                </label>
                <textarea
                  id="job-description"
                  class="form-control"
                  rows="5"
                  required
                ></textarea>
              </div>

              <div class="mb-3">
                <label for="job-requirements" class="form-label">
                  Yêu cầu ứng viên *
                </label>
                <textarea
                  id="job-requirements"
                  class="form-control"
                  rows="4"
                  required
                ></textarea>
              </div>

              <div class="mb-3">
                <label for="required-skill-input" class="form-label">
                  Kỹ năng bắt buộc *
                </label>

                <div class="input-group">
                  <input
                    type="text"
                    id="required-skill-input"
                    class="form-control"
                    placeholder="Ví dụ: Python"
                    aria-describedby="required-skill-help"
                  />
                  <button
                    type="button"
                    id="required-skill-add"
                    class="btn btn-outline-primary"
                  >
                    Thêm
                  </button>
                </div>

                <div id="required-skill-help" class="form-text">
                  Nhập một kỹ năng rồi nhấn Enter hoặc Thêm.
                </div>

                <div
                  id="required-skill-tags"
                  class="d-flex flex-wrap gap-2 mt-2"
                  role="group"
                  aria-label="Kỹ năng bắt buộc đã chọn"
                ></div>
              </div>

              <div class="mb-3">
                <label for="preferred-skill-input" class="form-label">
                  Kỹ năng ưu tiên
                </label>

                <div class="input-group">
                  <input
                    type="text"
                    id="preferred-skill-input"
                    class="form-control"
                    placeholder="Ví dụ: Docker"
                  />
                  <button
                    type="button"
                    id="preferred-skill-add"
                    class="btn btn-outline-success"
                  >
                    Thêm
                  </button>
                </div>

                <div
                  id="preferred-skill-tags"
                  class="d-flex flex-wrap gap-2 mt-2"
                  role="group"
                  aria-label="Kỹ năng ưu tiên đã chọn"
                ></div>
              </div>

              <div class="mb-3">
                <label for="job-experience" class="form-label">
                  Số năm kinh nghiệm tối thiểu *
                </label>
                <input
                  type="number"
                  id="job-experience"
                  class="form-control"
                  min="0"
                  step="1"
                  value="0"
                  required
                />
              </div>
            </fieldset>
          </form>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-outline-secondary"
            data-bs-dismiss="modal"
          >
            Hủy
          </button>

          <button
            type="submit"
            form="job-form"
            id="job-save-button"
            class="btn btn-primary"
          >
            Lưu tin
          </button>
        </div>
      </div>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <script src="../js/api.js"></script>
  <script src="../js/admin/admin.js"></script>
</body>
</html>
