<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartRecruit AI — Tìm việc làm</title>

  <!-- Bootstrap 5 CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">🤖 SmartRecruit AI</a>
      <span class="navbar-text text-white-50">Cổng thông tin tuyển dụng</span>
    </div>
  </nav>

  <!-- Hero -->
  <div class="bg-light py-5 text-center border-bottom">
    <h1 class="display-5 fw-bold">Cơ hội việc làm</h1>
    <p class="lead text-muted">Nộp hồ sơ trực tuyến — AI sẽ đánh giá và phản hồi nhanh chóng.</p>
  </div>

  <!-- Job listings (populated by JS) -->
  <div class="container py-4">
    <div id="job-list" class="row g-3">
      <div class="col-12 text-center text-muted py-5">
        <div class="spinner-border" role="status"></div>
        <p class="mt-2">Đang tải danh sách việc làm…</p>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS CDN -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmLewpXSHH2Q6v3V6HM3q4cL+"
    crossorigin="anonymous"
  ></script>

  <script src="js/api.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
