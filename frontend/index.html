<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartRecruit AI — Tìm việc làm</title>

  <!-- Font Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5.3.3, theme Bootswatch Zephyr (dùng thay bootstrap.min.css) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/zephyr/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-HUqMmx587pEpVPUDL2fU/GZ0FWpp1BEFYrt7gdZjPHvhOw1cgj15JqvhLWdXaHrb"
    crossorigin="anonymous"
  />

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    rel="stylesheet"
    integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk"
    crossorigin="anonymous"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="portal-body">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
        <span class="brand-logo"><i class="bi bi-stars"></i></span>
        SmartRecruit AI
      </a>
      <span class="navbar-text text-muted small d-none d-md-inline">
        <i class="bi bi-briefcase me-1"></i>Cổng thông tin tuyển dụng
      </span>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero py-5">
    <div class="container py-lg-4">
      <span class="badge rounded-pill text-bg-light text-primary mb-3">
        <i class="bi bi-cpu me-1"></i>Sàng lọc hồ sơ bằng AI
      </span>
      <h1 class="display-5 fw-bold mb-3">Tìm công việc phù hợp với bạn</h1>
      <p class="lead mb-0 opacity-75">Nộp hồ sơ trực tuyến — AI sẽ đánh giá và phản hồi nhanh chóng.</p>
    </div>
  </header>

  <!-- Job listings (populated by JS) -->
  <main class="container py-5">
    <h2 class="h4 fw-bold mb-1">Việc làm đang tuyển</h2>
    <p class="text-muted mb-4">Bấm vào một vị trí để xem chi tiết và ứng tuyển</p>

    <div id="job-list" class="row g-4">
      <div class="col-12 text-center text-muted py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Đang tải danh sách việc làm…</p>
      </div>
    </div>
  </main>

  <footer class="border-top bg-white py-4 text-center text-muted small">© 2026 SmartRecruit AI</footer>

  <!-- Bootstrap 5 JS CDN -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>

  <script src="js/api.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
